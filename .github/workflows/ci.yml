name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: wasm-tools
        run: |
          curl -fsSL -o /tmp/wasm-tools.tgz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.262.0/wasm-tools-1.262.0-x86_64-linux.tar.gz
          echo "655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65  /tmp/wasm-tools.tgz" | sha256sum -c -
          tar -xzf /tmp/wasm-tools.tgz -C /tmp
          echo /tmp/wasm-tools-1.262.0-x86_64-linux >> "$GITHUB_PATH"
      - run: ./build.sh
